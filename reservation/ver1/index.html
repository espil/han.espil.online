<!DOCTYPE html>
<html>
<head>
    <style>
        body, html {
            margin: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        .section {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s;
            background-color: #ccc;
        }

        .buttons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        #section1 {
            z-index: 1;
        }

        #section2 {
            transform: translateX(-100%);
            background-color: rgb(17, 59, 95);
        }

        #section3 {
            transform: translateX(100%);
            background-color: rgb(95, 17, 65);
        }

        #section4 {
            transform: translateY(-100%);
            background-color: rgb(87, 95, 17);
        }

        #section5 {
            transform: translateY(100%);
            background-color: rgb(95, 20, 17);
        }

        button {
            padding: 10px 20px;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="scripts.js"></script>
    <script src="appointments.js"></script>
    <script src="codes.js"></script>
</head>
<body>

            <input type="time" id="appointmentTime" name="appointmentTime" value="<?php echo date('H:i'); ?>"><br>

            <textarea id="followUpNotes" name="followUpNotes"></textarea><br>

</html>
